# develop -> dev, main -> prod.
# Builds the image, pushes it to Artifact Registry, then tells the env's VM to run it.
# Infra (VMs, brokers, secrets) is Terraform's job: see infra/README.md.
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'develop' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    # Add required reviewers to the "prod" environment in GitHub to gate prod deploys.
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      REGION: us-central1
      ZONE: us-central1-a
      REGISTRY: us-central1-docker.pkg.dev
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Image name
        run: echo "IMAGE=$REGISTRY/${{ vars.GCP_PROJECT_ID }}/spottrack-docker/spottrack-platform:${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - run: gcloud auth configure-docker "$REGISTRY" --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM
        run: |
          VM="spottrack-$ENV_NAME-backend"
          gcloud compute instances add-metadata "$VM" --zone "$ZONE" \
            --metadata app-image="$IMAGE"
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap \
            --strict-host-key-checking=no --quiet \
            --command 'curl -sf -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/attributes/deploy-script | sudo bash'
