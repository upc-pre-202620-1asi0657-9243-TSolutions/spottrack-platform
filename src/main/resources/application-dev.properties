# Development profile
# Conexión directa al motor de MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/spottrack-platform?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=andre

# MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Developer-friendly JPA behavior (Crea las tablas automáticamente)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true


# Stripe
# Set STRIPE_API_KEY to your own test secret key (sk_test_...).
stripe.api-key=${STRIPE_API_KEY}
# Run: stripe listen --forward-to localhost:8080/api/v1/webhooks/stripe
# Then set STRIPE_WEBHOOK_SECRET to the printed signing secret (whsec_...).
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}


# Puerto de la aplicación
server.port=8080
